name: ${COMPOSE_PROJECT_NAME:-promptedit-assignment}

x-app: &app
    build:
        context: .
        target: development
        args:
            APP_UID: ${APP_UID:-1000}
            APP_GID: ${APP_GID:-1000}
    image: ${COMPOSE_PROJECT_NAME:-promptedit-assignment}-php:local
    init: true
    healthcheck:
        disable: true
    working_dir: /app
    environment: &environment
        DB_CONNECTION: pgsql
        DB_HOST: postgres
        DB_PORT: 5432
        REDIS_HOST: redis
        REDIS_PORT: 6379
        REVERB_HOST: reverb
        REVERB_PORT: 8080
        REVERB_SCHEME: http
        REVERB_SERVER_HOST: 0.0.0.0
        REVERB_SERVER_PORT: 8080
        INERTIA_SSR_ENABLED: 'false'
    volumes:
        - .:/app
        - vendor:/app/vendor
        - node_modules:/app/node_modules

services:
    setup:
        <<: *app
        restart: 'no'
        command:
            - sh
            - -ec
            - |
                composer install --no-interaction --prefer-dist
                if ! grep -q '^APP_KEY=base64:' .env; then
                  php artisan key:generate --no-interaction
                fi
                php artisan config:clear --no-interaction
                php artisan migrate --no-interaction
                npm ci
                npm run build
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    app:
        <<: *app
        restart: unless-stopped
        ports:
            - '127.0.0.1:${APP_PORT:-8088}:8080'
        depends_on:
            setup:
                condition: service_completed_successfully
            reverb:
                condition: service_started
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '--fail',
                    '--silent',
                    'http://localhost:8080/up',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    horizon:
        <<: *app
        restart: unless-stopped
        command: ['php', 'artisan', 'horizon', '--no-interaction']
        stop_grace_period: 90s
        depends_on:
            setup:
                condition: service_completed_successfully

    reverb:
        <<: *app
        restart: unless-stopped
        command: ['php', 'artisan', 'reverb:start', '--no-interaction']
        depends_on:
            setup:
                condition: service_completed_successfully

    scheduler:
        <<: *app
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work', '--no-interaction']
        depends_on:
            setup:
                condition: service_completed_successfully

    vite:
        <<: *app
        profiles: [dev]
        restart: unless-stopped
        environment:
            <<: *environment
            DOCKER_VITE_PORT: ${VITE_PORT:-5178}
        command:
            [
                'npm',
                'run',
                'dev',
                '--',
                '--host',
                '0.0.0.0',
                '--port',
                '5173',
                '--strictPort',
            ]
        ports:
            - '127.0.0.1:${VITE_PORT:-5178}:5173'
        depends_on:
            setup:
                condition: service_completed_successfully

    postgres:
        image: postgres:18-bookworm
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-promptedit_assignment}
            POSTGRES_USER: ${DB_USERNAME:-promptedit}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - postgres:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-bookworm
        restart: unless-stopped
        command:
            [
                'redis-server',
                '--appendonly',
                'yes',
                '--maxmemory-policy',
                'noeviction',
            ]
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres:
    redis:
    vendor:
    node_modules:
